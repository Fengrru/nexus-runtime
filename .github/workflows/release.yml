name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Verify the tag passes all quality gates before releasing
  gate:
    name: Release Gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
    - run: cargo fmt --all -- --check
    - run: cargo clippy --all-targets -- -D warnings
    - run: cargo test --workspace
    - run: cargo test -p phoenix-tests -- --nocapture
    - run: cargo deny check licenses
    - run: cargo deny check advisories

  # Build release binaries for all platforms
  build:
    name: Build (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: nexus
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: nexus
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: nexus.exe

    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - uses: Swatinem/rust-cache@v2

    - name: Build release binary
      run: cargo build --bin nexus --release --target ${{ matrix.target }}

    - name: Strip binary (Linux/macOS)
      if: runner.os != 'Windows'
      run: strip target/${{ matrix.target }}/release/${{ matrix.artifact }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nexus-${{ matrix.target }}
        path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  # Build and push Docker image
  docker:
    name: Docker Image
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Create GitHub Release
  github-release:
    name: GitHub Release
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create archives
      run: |
        cd artifacts
        for dir in nexus-*; do
          if [ -f "$dir/nexus" ] || [ -f "$dir/nexus.exe" ]; then
            tar -czf "${dir}.tar.gz" -C "$dir" .
          fi
        done

    - name: Generate changelog
      id: changelog
      run: |
        awk '/^## \[/{if (p) exit; p=1} p' CHANGELOG.md | tail -n +2 > release-notes.md
        echo "notes<<EOF" >> $GITHUB_OUTPUT
        cat release-notes.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: release-notes.md
        files: artifacts/*.tar.gz
        generate_release_notes: true
